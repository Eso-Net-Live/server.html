<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Fixed</title>
</head>
<body>
    <div id="log">Завантаження даних...</div>

    <script>
    function updateStatus(data) {
        document.getElementById('log').innerText = "Дані успішно отримано!";
        console.log("=== ВАШ JSON ===");
        console.log(data);
    }

    async function loadNeptunAlerts() {
        try {
            // Додаємо випадковий параметр ?v=, щоб змусити GitHub віддати СВІЖИЙ текстовий файл
            const txtResponse = await fetch('APISDSADASDASD.txt?v=' + Math.random());
            const rawUrl = await txtResponse.text();
            const NAHR_THREATS_URL = rawUrl.trim();

            // Використовуємо інший проксі цільним рядком, щоб нічого не зклеювалось з помилками
            const proxyUrl = "https://freeboard.io" + NAHR_THREATS_URL;
            
            console.log("ЗАПИТ ВІДПРАВЛЕНО НА:", proxyUrl);

            const response = await fetch(proxyUrl);
            if (!response.ok) {
                throw new Error(`Статус: ${response.status}. Перевірте, чи токен у TXT файлі ще свіжий.`);
            }

            const data = await response.json();
            updateStatus(data);

        } catch (error) {
            document.getElementById('log').innerText = "Помилка: " + error.message;
            console.error("Деталі:", error);
        }
    }

    loadNeptunAlerts();
    </script>
</body>
</html>
