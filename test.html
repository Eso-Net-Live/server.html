<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar</title>
</head>
<body>
    <div id="log">Завантаження...</div>

    <script>
    function updateStatus(data) {
        document.getElementById('log').innerText = "Дані отримано!";
        console.log(data);
    }

    async function loadNeptunAlerts() {
        try {
            // 1. Читаємо посилання з вашого файлу
            const txtResponse = await fetch('APISDSADASDASD.txt');
            const NAHR_THREATS_URL = await txtResponse.text();

            // 2. Прямий запит без проксі та без кодування
            const response = await fetch(NAHR_THREATS_URL.trim());
            const data = await response.json();
            
            updateStatus(data);
        } catch (error) {
            document.getElementById('log').innerText = "Помилка: " + error.message;
            console.error(error);
        }
    }

    loadNeptunAlerts();
    </script>
</body>
</html>
